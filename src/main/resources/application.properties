spring.application.name=autotrader
server.port=9090

# Response compression — gzip JSON / HTML / CSS / JS so large payloads transfer fast
# over the public proxy path. /api/scanner/watchlist (~200KB JSON) compresses to ~25KB,
# turning multi-second downloads into a few hundred ms. min-response-size skips tiny
# responses where compression overhead isn't worth it.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024
#fyers.client-id=3CJ0ZQGMCY-100
#fyers.secret-key=BUBG6C7R8M
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Template caching disabled for dev — UI edits reflect on browser refresh without
# an app restart. Costs ~1-2s TTFB per page nav on the heavy templates (scanner.html
# ~2000 lines, settings.html ~2000 lines). Set to true for production builds.
spring.thymeleaf.cache=false

