# Global Data Feeds (GDFL) WebSocket — alternate NFO tick source for ATM CE/PE.
# The bot subscribes DYNAMICALLY to today's ATM once OptionBuying resolves it (~09:18 IST).
# Expiry is decoded from the Fyers symbol Fyers chose for us — no config needed for
# weekly rollover. Fyers feed keeps running for all non-GDFL symbols; GDFL ticks fan
# into the same LTP listener chain (see GdflService.onGdflTick).
gdfl.enabled=true
# Endpoint + API key MUST come from environment variables — no defaults are
# committed here so credentials never end up in git and there's no test URL
# to accidentally hit in production. Set both on the host before starting:
#   export GDFL_ENDPOINT=wss://prod.your-vendor.example:443
#   export GDFL_API_KEY=<prod-key>
# If either is missing (and gdfl.enabled=true), GdflService.boot fails
# hard with IllegalStateException so the server refuses to start.
gdfl.endpoint=${GDFL_ENDPOINT:}
gdfl.api-key=${GDFL_API_KEY:}
gdfl.exchange=NFO
gdfl.atm-poll-interval-seconds=5
gdfl.reconnect-delay-seconds=5