<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Charts — TraderEdge</title>
    <link rel="stylesheet" th:href="@{/css/shared.css}">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-primary); font-family: 'Roboto Mono', monospace; }
        .cw-grid { background: var(--bg-base); }
        .cw-root { display: flex; flex-direction: column; height: 100vh; }
        .cw-header {
            display: flex; align-items: center; gap: 14px;
            padding: 8px 14px; border-bottom: 1px solid var(--border);
            background: var(--bg-card); flex-shrink: 0;
        }
        .cw-title { font-size: 0.82rem; font-weight: 700; color: var(--text-primary); letter-spacing: 0.04em; }
        /* Match the scanner page's filter-dropdown look: card-tinted background,
           border-coloured outline, secondary text. The default browser <select>
           paints white in dark themes — these vars force theme parity. */
        .cw-header select {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 10px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            min-width: 240px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
            background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 28px;
        }
        .cw-header select:hover { border-color: var(--accent-cyan); }
        .cw-header select option { background: var(--bg-card); color: var(--text-primary); }
        .cw-header .cw-sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.05em; }
        .cw-grid {
            flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 8px; padding: 8px; min-height: 0;
        }
        .cw-pane {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
            display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0;
        }
        .cw-pane-header {
            padding: 5px 10px; border-bottom: 1px solid var(--border);
            font-size: 0.7rem; font-weight: 700; color: var(--text-secondary);
            letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cw-pane-body { flex: 1; position: relative; min-height: 0; min-width: 0; overflow: hidden; }
        .cw-pane-empty {
            display: flex; align-items: center; justify-content: center; height: 100%;
            color: var(--text-muted); font-size: 0.75rem;
        }
        .cw-ltp { color: var(--text-primary); font-weight: 700; font-size: 0.78rem; }
        .cw-ltp.up   { color: var(--accent-green); }
        .cw-ltp.down { color: var(--accent-red);   }
        .cw-pane-actions { display: flex; gap: 6px; align-items: center; }
        .cw-gear {
            background: transparent; border: 1px solid var(--border); border-radius: 4px;
            color: var(--text-secondary); padding: 2px 5px; cursor: pointer;
            display: inline-flex; align-items: center; line-height: 0;
        }
        .cw-gear:hover { border-color: var(--accent-cyan); color: var(--text-primary); }
        .cw-expand {
            background: transparent; border: 1px solid var(--border); border-radius: 4px;
            color: var(--text-secondary); padding: 2px 5px; cursor: pointer;
            display: inline-flex; align-items: center; line-height: 0;
        }
        .cw-expand:hover { border-color: var(--accent-cyan); color: var(--text-primary); }
        .cw-pane.cw-expanded .cw-expand { color: var(--accent-cyan); border-color: var(--accent-cyan); }
        /* Index-only mode: 2 columns × 1 row showing just index5 + index60 side by side. */
        .cw-grid.cw-mode-index { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .cw-grid.cw-mode-index > .cw-pane[data-pane="stock5"],
        .cw-grid.cw-mode-index > .cw-pane[data-pane="stock60"] { display: none; }
        /* Index HTF Alignment disabled in settings → hide the 1h pane and let the
           5m pane occupy the whole window. Same idea as the expand state but driven
           by the user's filter preference rather than a per-session click. */
        .cw-grid.cw-mode-index.cw-htf-off { grid-template-columns: 1fr; }
        .cw-grid.cw-mode-index.cw-htf-off > .cw-pane[data-pane="index60"] { display: none; }
        /* Stock-mode adaptive layouts. Pane count is computed at init from the
           Index 5m / Index HTF / Stock HTF filter toggles in Scanner Settings:
             1 chart  → fills the window
             2 charts → side by side
             3 charts → top row 2 + bottom row 1 spanning both columns
             4 charts → 2×2 matrix
           Stock 5m is always shown (it's the primary view); the other panes
           appear only when their filter is on. The third-pane row-span for
           count=3 is set inline by JS on whichever pane lands in position 3. */
        .cw-grid.cw-count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .cw-grid.cw-count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .cw-grid.cw-count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .cw-grid.cw-count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        /* Expanded pane wins over the mode-specific grid templates above. Defined
           AFTER .cw-mode-index so same-specificity rules cascade in our favour,
           and the .cw-mode-index.cw-has-expanded compound selector adds an extra
           class for belt-and-braces specificity. */
        .cw-grid.cw-has-expanded > .cw-pane:not(.cw-expanded) { display: none; }
        .cw-grid.cw-has-expanded,
        .cw-grid.cw-mode-index.cw-has-expanded { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .cw-prefs {
            position: absolute; top: 6px; right: 6px; z-index: 20;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35); padding: 10px 12px;
            font-family: var(--font-mono); font-size: 0.7rem;
            min-width: 200px; max-height: 80%; overflow-y: auto;
            color: var(--text-primary); display: none;
        }
        .cw-prefs.open { display: block; }
        .cw-prefs-group {
            color: var(--text-muted); font-size: 0.6rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            margin: 8px 0 3px; font-weight: 700;
        }
        .cw-prefs-group:first-child { margin-top: 0; }
        .cw-prefs label {
            display: flex; align-items: center; gap: 6px;
            padding: 2px 0; cursor: pointer; color: var(--text-primary);
        }
        .cw-prefs label input { margin: 0; }
        .cw-prefs label .swatch {
            display: inline-block; width: 12px; height: 2px;
        }
    </style>
</head>

<script th:inline="javascript">
(function() {
    'use strict';

    // ── Theme bootstrap (matches the other pages) ─────────────────────────
    try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }

    // ── State: one pane object per quadrant. Each pane holds its own chart
    //   instance + refresh timer; symbol/interval flips when user changes the
    //   stock dropdown so a fresh fetch loads cleanly. ─────────────────────
    var panes = {
        stock5:  { key: 'stock5',  containerId: 'paneStock5',  ltpId: 'ltpStock5',  hdrId: 'hdrStock5',  interval: 5,  symbol: null, chart: null, candleSeries: null, emaSeries: null, levelSeries: [], timer: null, lastData: null, sess: null, label: 'STOCK · 5M' },
        stock60: { key: 'stock60', containerId: 'paneStock60', ltpId: 'ltpStock60', hdrId: 'hdrStock60', interval: 60, symbol: null, chart: null, candleSeries: null, emaSeries: null, levelSeries: [], timer: null, lastData: null, sess: null, label: 'STOCK · 1H' },
        index5:  { key: 'index5',  containerId: 'paneIndex5',  ltpId: 'ltpIndex5',  hdrId: 'hdrIndex5',  interval: 5,  symbol: null, chart: null, candleSeries: null, emaSeries: null, levelSeries: [], timer: null, lastData: null, sess: null, label: 'INDEX · 5M' },
        index60: { key: 'index60', containerId: 'paneIndex60', ltpId: 'ltpIndex60', hdrId: 'hdrIndex60', interval: 60, symbol: null, chart: null, candleSeries: null, emaSeries: null, levelSeries: [], timer: null, lastData: null, sess: null, label: 'INDEX · 1H' }
    };

    // ── Per-pane chart-layer preferences. Persisted in localStorage so the
    //   popup remembers checkbox state across opens. Defaults match the
    //   chart-modal: most layers on, R3/R4/S3/S4 off by default to reduce
    //   clutter on the smaller 4-pane canvas. ─────────────────────────────
    var DEFAULT_PREFS = {
        cprBand: true, r1pdhBand: true, s1pdlBand: true,
        cprLines: true, pivot: true,
        r1: true, r2: true, r3: false, r4: false,
        s1: true, s2: true, s3: false, s4: false,
        pdhPdl: true, openRange: true, ema20: true
    };
    var allPrefs = (function() {
        try {
            var stored = JSON.parse(localStorage.getItem('cwChartPrefs') || '{}') || {};
            var out = {};
            Object.keys(panes).forEach(function(k) {
                out[k] = Object.assign({}, DEFAULT_PREFS, stored[k] || {});
            });
            return out;
        } catch (e) {
            var out = {};
            Object.keys(panes).forEach(function(k) { out[k] = Object.assign({}, DEFAULT_PREFS); });
            return out;
        }
    })();
    function savePrefs() {
        try { localStorage.setItem('cwChartPrefs', JSON.stringify(allPrefs)); } catch (e) {}
    }
    function prefsFor(paneKey) { return allPrefs[paneKey] || DEFAULT_PREFS; }

    // URL params seed the initial state. Falls back to first enabled stock from
    // the dropdown if not provided (e.g., direct URL load without context).
    var urlParams = new URLSearchParams(location.search);
    var initialSymbol = urlParams.get('symbol');         // e.g. NSE:RELIANCE-EQ
    var initialIndex  = urlParams.get('index');          // e.g. NSE:NIFTYOILANDGAS-INDEX
    var initialShort  = urlParams.get('name') || '';
    // mode=index → only the two index panes (5m + 1h) side-by-side.
    //   The dropdown lists indices, not stocks, and the stock panes are hidden.
    // mode=stock (default) → full 2x2 grid.
    var mode = (urlParams.get('mode') || 'stock').toLowerCase();
    var isIndexMode = (mode === 'index');

    // ── Helpers (lightweight-charts) ──────────────────────────────────────
    function isDark() { return document.documentElement.getAttribute('data-theme') !== 'light'; }
    function istTime(unixSec) {
        return new Date(unixSec * 1000).toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
    }
    function istWeekday(unixSec) {
        // 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'. IST timezone forced — otherwise the
        // user's local timezone could flip a Friday-evening tick to Saturday.
        return new Date(unixSec * 1000).toLocaleDateString('en-GB', { timeZone: 'Asia/Kolkata', weekday: 'short' });
    }
    function istDateTime(unixSec) {
        var d = new Date(unixSec * 1000);
        var date = d.toLocaleDateString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short' });
        return date + ' ' + istTime(unixSec);
    }

    function toLwcBars(ohlc) {
        var seen = {};
        return (ohlc || []).map(function(c) {
            return { time: Math.floor(c.t / 1000), open: c.o, high: c.h, low: c.l, close: c.c };
        }).filter(function(b) { if (seen[b.time]) return false; seen[b.time] = true; return true; })
          .sort(function(a, b) { return a.time - b.time; });
    }
    function toLwcLine(series) {
        if (!series || !series.length) return [];
        var seen = {};
        return series.map(function(p) { return { time: Math.floor(p.t / 1000), value: p.v }; })
          .filter(function(b) { if (seen[b.time] || b.value == null || b.value === 0) return false; seen[b.time] = true; return true; })
          .sort(function(a, b) { return a.time - b.time; });
    }

    // Empty the pane-body of chart DOM without nuking the .cw-prefs popover
    // that lives inside it — otherwise the popover element disappears on the
    // first chart load and the gear button has nothing to toggle.
    function wipeChartContainer(p) {
        var c = document.getElementById(p.containerId);
        if (!c) return null;
        var prefs = c.querySelector('.cw-prefs');
        c.innerHTML = '';
        if (prefs) c.appendChild(prefs);
        return c;
    }

    function clearPane(p) {
        if (p.timer) { clearInterval(p.timer); p.timer = null; }
        if (p.chart) {
            try { p.chart.remove(); } catch (e) {}
            p.chart = null;
            p.candleSeries = null;
            p.emaSeries = null;
            p.levelSeries = [];
        }
        wipeChartContainer(p);
    }

    function buildChart(p, bars, emaLine) {
        var container = wipeChartContainer(p);
        if (!container) return;
        var dark = isDark();
        var bg = dark ? '#0f1418' : '#ffffff';
        var text = dark ? '#d0d4d8' : '#2a2e33';
        var grid = dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
        p.chart = LightweightCharts.createChart(container, {
            autoSize: true,
            layout: { background: { type: 'solid', color: bg }, textColor: text, fontFamily: 'Roboto Mono, monospace', fontSize: 10 },
            grid: { vertLines: { color: grid }, horzLines: { color: grid } },
            rightPriceScale: { borderColor: grid, scaleMargins: { top: 0.08, bottom: 0.08 } },
            timeScale: {
                borderColor: grid, timeVisible: true, secondsVisible: false,
                rightOffset: 2, minBarSpacing: 0.5,
                // 1-hour panes span Mon-Fri so the user wants day names visible.
                // Lightweight Charts calls this with the integer tickMarkType
                // (0=Year, 1=Month, 2=DayOfMonth, 3=Time). At day boundaries
                // (tickMarkType 2) we substitute the weekday name; at intra-day
                // ticks we show HH:MM. 5-min panes always render HH:MM since
                // the whole timeline is a single session.
                tickMarkFormatter: (function(interval) {
                    return function(time, tickMarkType) {
                        if (interval === 60 && tickMarkType === 2) return istWeekday(time);
                        return istTime(time);
                    };
                })(p.interval)
            },
            localization: { locale: 'en-IN', timeFormatter: function(time) { return istDateTime(time); } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            handleScroll: { mouseWheel: true, pressedMouseMove: true },
            handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
        });
        p.candleSeries = p.chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
            priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
        });
        p.candleSeries.setData(bars);
        p.emaSeries = p.chart.addLineSeries({
            color: '#66bb6a', lineWidth: 2,
            priceLineVisible: false, lastValueVisible: true, title: 'EMA20',
            crosshairMarkerVisible: false
        });
        p.emaSeries.setData(emaLine);

        // Cross-pane crosshair sync. When the user hovers on this chart, push the
        // same time onto every other chart so the user can read aligned data across
        // all panes simultaneously. The horizontal line on the OTHER panes anchors
        // to that pane's own candle close at the synced time (instead of an
        // arbitrary price), so each pane's horizontal line lands on its own price
        // scale. Panes with no candle at the requested time (different time ranges)
        // gracefully clear their crosshair.
        var thisKey = p.key;
        p.chart.subscribeCrosshairMove(function(param) {
            if (!param || !param.time) {
                Object.keys(panes).forEach(function(k) {
                    if (k === thisKey) return;
                    var pp = panes[k];
                    if (pp && pp.chart) {
                        try { pp.chart.clearCrosshairPosition(); } catch (e) {}
                    }
                });
                return;
            }
            Object.keys(panes).forEach(function(k) {
                if (k === thisKey) return;
                var pp = panes[k];
                if (!pp || !pp.chart || !pp.candleSeries) return;
                var price = priceAtTime(pp, param.time);
                try {
                    if (price != null) {
                        pp.chart.setCrosshairPosition(price, param.time, pp.candleSeries);
                    } else {
                        pp.chart.clearCrosshairPosition();
                    }
                } catch (e) {}
            });
        });
    }

    // Returns the candle close on pane {@code pane} at or just before {@code timeSec}.
    // Used so the synced horizontal crosshair on each receiver pane lands on that
    // pane's own price level. Returns null if no candle covers (≤) the time.
    function priceAtTime(pane, timeSec) {
        if (!pane || !pane.lastData || !pane.lastData.candles) return null;
        var targetMs = timeSec * 1000;
        var bars = pane.lastData.candles;
        // Bars are chronologically sorted; walk from the end for the most-recent
        // bar whose start time is ≤ target. Linear scan is fine — at 30-100 bars
        // per pane it's well under a frame.
        for (var i = bars.length - 1; i >= 0; i--) {
            if (bars[i].t <= targetMs) return bars[i].c;
        }
        return null;
    }

    function addLine(p, value, color, label, startSec, endSec) {
        if (!value || value <= 0 || !p.chart) return;
        var s = p.chart.addLineSeries({
            color: color, lineWidth: 1,
            priceLineVisible: false, lastValueVisible: true, title: label,
            crosshairMarkerVisible: false
        });
        // Sample density: 1-hour pane spans ~5 days, sample every 1h. 5-min pane
        // spans one session, sample every 5 min. Sparse sampling keeps the line
        // smooth without 1000s of points slowing down the chart.
        var step = p.interval === 60 ? 3600 : 300;
        var data = [];
        for (var t = startSec; t <= endSec; t += step) data.push({ time: t, value: value });
        // The hourly step lands the last point at 15:15 (6 full hours past 9:15) so
        // the line stops short of the 15:30 close. Append the exact endSec sample
        // so the line stretches all the way to session/week close.
        if (data.length === 0 || data[data.length - 1].time < endSec) {
            data.push({ time: endSec, value: value });
        }
        s.setData(data);
        p.levelSeries.push(s);
    }

    function addBand(p, top, bottom, fillColor1, fillColor2, startSec, endSec) {
        if (!top || !bottom || top <= 0 || bottom <= 0 || !p.chart) return;
        var hi = Math.max(top, bottom);
        var lo = Math.min(top, bottom);
        var s = p.chart.addBaselineSeries({
            baseValue: { type: 'price', price: lo },
            topLineColor: 'transparent',
            topFillColor1: fillColor1,
            topFillColor2: fillColor2,
            bottomLineColor: 'transparent',
            bottomFillColor1: 'transparent',
            bottomFillColor2: 'transparent',
            priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false
        });
        s.setData([{ time: startSec, value: hi }, { time: endSec, value: hi }]);
        p.levelSeries.push(s);
    }

    function applyLevels(p, d) {
        if (!p.chart) return;
        // Remove prior level lines/bands.
        p.levelSeries.forEach(function(s) { try { p.chart.removeSeries(s); } catch (e) {} });
        p.levelSeries = [];
        var candles = d.candles || [];
        if (candles.length === 0 && p.interval !== 60) return;
        var sessStart, sessEnd;
        if (p.interval === 60) {
            // Hourly pane: anchor at the full trading week (Mon 9:15 → Fri 15:30, in
            // epoch seconds) supplied by the backend. Falls back to first/last bar
            // when the explicit week boundaries are absent (defensive — shouldn't
            // happen with the matching backend change).
            if (d.weekStart && d.weekEnd) {
                sessStart = Math.floor(d.weekStart / 1000);
                sessEnd   = Math.floor(d.weekEnd / 1000);
            } else if (candles.length > 0) {
                sessStart = Math.floor(candles[0].t / 1000);
                sessEnd   = Math.floor(candles[candles.length - 1].t / 1000) + 3600;
            } else {
                return;
            }
        } else {
            // 5-min pane: clamp to today's session window 9:15 → 15:30 IST.
            var first = new Date(candles[0].t);
            sessStart = Math.floor(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), first.getUTCDate(), 3, 45, 0) / 1000);
            sessEnd   = sessStart + (6 * 3600 + 15 * 60);
        }
        p.sess = { start: sessStart, end: sessEnd };
        var cpr = d.cpr || {};
        var pf  = prefsFor(p.key);

        // Bands drawn first so lines render on top.
        if (pf.cprBand)            addBand(p, cpr.top, cpr.bottom, 'rgba(100,150,255,0.20)', 'rgba(100,150,255,0.10)', sessStart, sessEnd);
        if (pf.r1pdhBand && cpr.r1 && cpr.pdh) addBand(p, cpr.r1, cpr.pdh, 'rgba(38,166,154,0.22)', 'rgba(38,166,154,0.10)', sessStart, sessEnd);
        if (pf.s1pdlBand && cpr.s1 && cpr.pdl) addBand(p, cpr.s1, cpr.pdl, 'rgba(239,83,80,0.22)', 'rgba(239,83,80,0.10)', sessStart, sessEnd);

        if (pf.cprLines) {
            addLine(p, cpr.top,    '#6496ff', 'CPR Top', sessStart, sessEnd);
            addLine(p, cpr.bottom, '#6496ff', 'CPR Bot', sessStart, sessEnd);
        }
        if (pf.pivot)  addLine(p, cpr.pivot, '#6496ff', 'Pivot', sessStart, sessEnd);
        if (pf.r1)     addLine(p, cpr.r1, '#26a69a', 'R1', sessStart, sessEnd);
        if (pf.r2)     addLine(p, cpr.r2, '#26a69a', 'R2', sessStart, sessEnd);
        if (pf.r3)     addLine(p, cpr.r3, '#26a69a', 'R3', sessStart, sessEnd);
        if (pf.r4)     addLine(p, cpr.r4, '#26a69a', 'R4', sessStart, sessEnd);
        if (pf.s1)     addLine(p, cpr.s1, '#ef5350', 'S1', sessStart, sessEnd);
        if (pf.s2)     addLine(p, cpr.s2, '#ef5350', 'S2', sessStart, sessEnd);
        if (pf.s3)     addLine(p, cpr.s3, '#ef5350', 'S3', sessStart, sessEnd);
        if (pf.s4)     addLine(p, cpr.s4, '#ef5350', 'S4', sessStart, sessEnd);
        if (pf.pdhPdl) {
            addLine(p, cpr.pdh, '#ffa726', 'PDH', sessStart, sessEnd);
            addLine(p, cpr.pdl, '#ffa726', 'PDL', sessStart, sessEnd);
        }
        if (pf.openRange) {
            // Open Range — only meaningful on live trading day (server returns 0 otherwise).
            if (cpr.orHigh) addLine(p, cpr.orHigh, '#f5d76e', 'OR-H', sessStart, sessEnd);
            if (cpr.orLow)  addLine(p, cpr.orLow,  '#f5d76e', 'OR-L', sessStart, sessEnd);
        }

        // EMA20 line visibility is toggled directly on the series rather than
        // recreated, so the historical line stays continuous across refreshes.
        if (p.emaSeries) p.emaSeries.applyOptions({ visible: !!pf.ema20 });
    }

    // ── Settings popover ─────────────────────────────────────────────────
    var PREF_GROUPS = [
        { label: 'Bands', items: [
            { key: 'cprBand',  label: 'CPR band',    color: '#6496ff' },
            { key: 'r1pdhBand',label: 'R1/PDH band', color: '#26a69a' },
            { key: 's1pdlBand',label: 'S1/PDL band', color: '#ef5350' }
        ]},
        { label: 'CPR & Pivot', items: [
            { key: 'cprLines', label: 'CPR Top/Bot', color: '#6496ff' },
            { key: 'pivot',    label: 'Pivot',       color: '#6496ff' }
        ]},
        { label: 'Resistance', items: [
            { key: 'r1', label: 'R1', color: '#26a69a' },
            { key: 'r2', label: 'R2', color: '#26a69a' },
            { key: 'r3', label: 'R3', color: '#26a69a' },
            { key: 'r4', label: 'R4', color: '#26a69a' }
        ]},
        { label: 'Support', items: [
            { key: 's1', label: 'S1', color: '#ef5350' },
            { key: 's2', label: 'S2', color: '#ef5350' },
            { key: 's3', label: 'S3', color: '#ef5350' },
            { key: 's4', label: 'S4', color: '#ef5350' }
        ]},
        { label: 'Prior Day', items: [
            { key: 'pdhPdl', label: 'PDH / PDL', color: '#ffa726' }
        ]},
        { label: 'Open Range', items: [
            { key: 'openRange', label: 'OR-H / OR-L', color: '#f5d76e' }
        ]},
        { label: 'Indicators', items: [
            { key: 'ema20', label: 'EMA 20', color: '#66bb6a' }
        ]}
    ];

    function renderPrefsPanel(paneKey) {
        var panel = document.querySelector('.cw-prefs[data-prefs-key="' + paneKey + '"]');
        if (!panel) return;
        var pf = prefsFor(paneKey);
        var html = '';
        PREF_GROUPS.forEach(function(g) {
            html += '<div class="cw-prefs-group">' + g.label + '</div>';
            g.items.forEach(function(it) {
                var checked = pf[it.key] ? 'checked' : '';
                html += '<label>'
                    + '<input type="checkbox" ' + checked + ' data-pkey="' + paneKey + '" data-key="' + it.key + '" />'
                    + '<span class="swatch" style="background:' + it.color + ';"></span>'
                    + '<span>' + it.label + '</span>'
                    + '</label>';
            });
        });
        panel.innerHTML = html;
        // Wire checkbox listeners.
        panel.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
            cb.addEventListener('change', function() {
                var pkey = this.getAttribute('data-pkey');
                var key  = this.getAttribute('data-key');
                allPrefs[pkey][key] = this.checked;
                savePrefs();
                // Re-apply levels on the affected pane only.
                var p = panes[pkey];
                if (p && p.lastData) applyLevels(p, p.lastData);
            });
        });
    }

    function togglePrefsPanel(paneKey) {
        var panel = document.querySelector('.cw-prefs[data-prefs-key="' + paneKey + '"]');
        if (!panel) return;
        var willOpen = !panel.classList.contains('open');
        // Close all other panels first.
        document.querySelectorAll('.cw-prefs').forEach(function(el) { el.classList.remove('open'); });
        if (willOpen) {
            renderPrefsPanel(paneKey);
            panel.classList.add('open');
        }
    }

    // ── Expand / restore one pane to fill the window ────────────────────
    // Clicking the same expand button while expanded restores the 2x2 grid.
    // We swap the SVG icon to a "collapse / inward arrows" glyph when expanded
    // so the button reads as a toggle. Lightweight Charts has autoSize:true,
    // so the chart re-fits its container automatically after the CSS change.
    var ICON_EXPAND = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
    var ICON_COLLAPSE = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';

    function togglePaneExpand(paneKey) {
        var grid = document.querySelector('.cw-grid');
        var target = document.querySelector('.cw-pane[data-pane="' + paneKey + '"]');
        if (!grid || !target) return;
        var isExpanded = target.classList.contains('cw-expanded');
        // Always collapse everything first, then expand the requested pane
        // (handles the case where another pane was expanded and the user clicks
        // a different pane's expand button — switch focus rather than no-op).
        document.querySelectorAll('.cw-pane.cw-expanded').forEach(function(el) {
            el.classList.remove('cw-expanded');
            var b = el.querySelector('.cw-expand');
            if (b) { b.innerHTML = ICON_EXPAND; b.title = 'Expand / restore'; }
        });
        grid.classList.remove('cw-has-expanded');
        if (!isExpanded) {
            target.classList.add('cw-expanded');
            grid.classList.add('cw-has-expanded');
            var b = target.querySelector('.cw-expand');
            if (b) { b.innerHTML = ICON_COLLAPSE; b.title = 'Restore grid'; }
        }
        // Nudge the affected chart to re-measure after the layout settles.
        setTimeout(function() {
            var p = panes[paneKey];
            if (p && p.chart) { try { p.chart.timeScale().fitContent(); } catch (e) {} }
            // Restoring the grid means all panes resize back; ask each chart to
            // fit again so the candles fill the smaller pane correctly.
            if (isExpanded) {
                Object.keys(panes).forEach(function(k) {
                    var pp = panes[k];
                    if (pp && pp.chart) {
                        try {
                            if (pp.sess) {
                                var pad = pp.interval === 60 ? 6 * 3600 : 1800;
                                pp.chart.timeScale().setVisibleRange({ from: pp.sess.start - pad, to: pp.sess.end + pad });
                            } else {
                                pp.chart.timeScale().fitContent();
                            }
                        } catch (e) {}
                    }
                });
            }
        }, 50);
    }

    // Wire gear + expand buttons + outside-click dismissal for the prefs panel.
    // The script lives at end of body so all .cw-gear / .cw-expand elements
    // already exist — we wire directly rather than waiting on DOMContentLoaded
    // because the external lightweight-charts script can delay our execution
    // past that event firing.
    function wirePaneButtons() {
        document.querySelectorAll('.cw-gear').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePrefsPanel(btn.getAttribute('data-pane-key'));
            });
        });
        document.querySelectorAll('.cw-expand').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePaneExpand(btn.getAttribute('data-pane-key'));
            });
        });
        document.addEventListener('click', function(e) {
            // Don't close if click landed inside a panel or on a gear button.
            if (e.target.closest('.cw-prefs') || e.target.closest('.cw-gear')) return;
            document.querySelectorAll('.cw-prefs').forEach(function(el) { el.classList.remove('open'); });
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', wirePaneButtons);
    } else {
        wirePaneButtons();
    }

    function loadPane(p, isFirst) {
        if (!p.symbol) {
            var c = wipeChartContainer(p);
            if (c) {
                var msg = document.createElement('div');
                msg.className = 'cw-pane-empty';
                msg.textContent = 'No symbol';
                c.appendChild(msg);
            }
            return Promise.resolve(false);
        }
        var url = '/api/scanner/chart?symbol=' + encodeURIComponent(p.symbol) + '&interval=' + p.interval;
        return fetch(url).then(function(r) { return r.json(); }).then(function(d) {
            p.lastData = d;
            var bars = toLwcBars(d.candles);
            var emaLine = toLwcLine(d.ema20Series);
            if (isFirst || !p.chart) {
                if (bars.length === 0) {
                    var c = wipeChartContainer(p);
                    if (c) {
                        var msg = document.createElement('div');
                        msg.className = 'cw-pane-empty';
                        msg.textContent = 'No data';
                        c.appendChild(msg);
                    }
                    return false;
                }
                buildChart(p, bars, emaLine);
                applyLevels(p, d);
                if (p.sess) {
                    // 1-hour weekly view: pad ½ day either side; 5-min single-session: pad 30 min.
                    var pad = p.interval === 60 ? 6 * 3600 : 1800;
                    try { p.chart.timeScale().setVisibleRange({ from: p.sess.start - pad, to: p.sess.end + pad }); }
                    catch (e) { try { p.chart.timeScale().fitContent(); } catch (e2) {} }
                }
            } else {
                // Incremental update — replace last bar and keep level lines in sync.
                if (bars.length > 0 && p.candleSeries) p.candleSeries.update(bars[bars.length - 1]);
                if (emaLine.length > 0 && p.emaSeries)  p.emaSeries.update(emaLine[emaLine.length - 1]);
                applyLevels(p, d);
            }
            // LTP chip on the pane header.
            var ltpEl = document.getElementById(p.ltpId);
            if (ltpEl && d.ltp != null) {
                ltpEl.textContent = Number(d.ltp).toFixed(2);
                var lastBar = bars[bars.length - 1];
                if (lastBar) {
                    ltpEl.className = 'cw-ltp ' + (lastBar.close >= lastBar.open ? 'up' : 'down');
                }
            }
            return d.tradingDay === true;
        }).catch(function(e) {
            console.error('[chart-window] load failed for', p.symbol, p.interval, e);
            return false;
        });
    }

    function startPane(p) {
        clearPane(p);
        loadPane(p, true).then(function(isLive) {
            if (isLive) {
                // 5-min panes refresh every 2s for live LTP; 1-hour panes can be slower.
                var ms = p.interval === 60 ? 5000 : 2000;
                p.timer = setInterval(function() { loadPane(p, false); }, ms);
            }
        });
    }

    function updateHeaderLabels() {
        document.getElementById('hdrStock5').textContent  = (panes.stock5.symbol  ? shortNameFromSymbol(panes.stock5.symbol)  : 'STOCK')  + ' · 5M';
        document.getElementById('hdrStock60').textContent = (panes.stock60.symbol ? shortNameFromSymbol(panes.stock60.symbol) : 'STOCK')  + ' · 1H';
        document.getElementById('hdrIndex5').textContent  = (panes.index5.symbol  ? shortNameFromSymbol(panes.index5.symbol)  : 'INDEX')  + ' · 5M';
        document.getElementById('hdrIndex60').textContent = (panes.index60.symbol ? shortNameFromSymbol(panes.index60.symbol) : 'INDEX')  + ' · 1H';
    }
    function shortNameFromSymbol(sym) {
        if (!sym) return '';
        return sym.replace(/^NSE:/, '').replace(/-(EQ|INDEX)$/, '');
    }

    // ── Symbol switching ─────────────────────────────────────────────────
    var stocksCache = [];  // [{ ticker, primaryIndexTicker, primaryIndexName, ... }]

    // True when index mode AND the Index HTF Alignment filter is disabled. In that
    // case the 1h pane is hidden via CSS (cw-htf-off class) and we skip starting
    // its loader entirely.
    var indexHtfHidden = false;

    // Per-pane visibility flags for stock mode. Stock 5m is always on; the
    // others mirror their respective filter toggles from /api/scanner/status.
    // Defaults assume all on so that if the status fetch fails we degrade to
    // the existing 2x2 layout instead of a blank pane.
    var paneShown = { stock5: true, stock60: true, index5: true, index60: true };

    function setSymbol(stockSym, indexSym) {
        // In index mode the stock panes are hidden + their loaders skipped; only
        // the two index panes drive a chart fetch.
        if (!isIndexMode) {
            panes.stock5.symbol  = stockSym;
            panes.stock60.symbol = stockSym;
        }
        panes.index5.symbol  = indexSym;
        panes.index60.symbol = indexSym;
        var idxLabel = indexSym ? shortNameFromSymbol(indexSym) : '—';
        document.getElementById('cwIndexLabel').textContent = (isIndexMode ? 'VIEWING: ' : 'INDEX: ') + idxLabel;
        updateHeaderLabels();
        if (!isIndexMode) {
            if (paneShown.stock5)  startPane(panes.stock5);
            if (paneShown.stock60) startPane(panes.stock60);
            if (paneShown.index5)  startPane(panes.index5);
            if (paneShown.index60) startPane(panes.index60);
        } else {
            startPane(panes.index5);
            if (!indexHtfHidden) startPane(panes.index60);
        }
        // Reflect in URL for bookmark/share.
        try {
            var url = new URL(location.href);
            if (stockSym && !isIndexMode) url.searchParams.set('symbol', stockSym); else url.searchParams.delete('symbol');
            if (indexSym) url.searchParams.set('index',  indexSym); else url.searchParams.delete('index');
            history.replaceState({}, '', url.toString());
        } catch (e) {}
        document.title = shortNameFromSymbol(isIndexMode ? indexSym : (stockSym || 'Charts')) + ' — Charts';
    }

    function populateStockDropdown() {
        // Drive the dropdown from the active scanner watchlist — these are the
        // stocks the bot is actually evaluating right now (passing CPR / price /
        // adaptive-state filters). Using /api/stocks instead would list every
        // enabled DB row, including ones currently filtered out (e.g. wide CPR
        // when wide stocks are disabled), which is misleading for charting.
        return fetch('/api/scanner/watchlist').then(function(r) { return r.json(); }).then(function(rows) {
            stocksCache = (rows || []).filter(function(s) { return s && s.symbol && s.shortName; });
            stocksCache.sort(function(a, b) { return (a.shortName || '').localeCompare(b.shortName || ''); });
            var sel = document.getElementById('cwSymbol');
            var html = '';
            stocksCache.forEach(function(s) {
                var idxTicker = s.primaryIndexTicker || '';
                html += '<option value="' + s.symbol + '" data-index="' + idxTicker + '">' + s.shortName + '</option>';
            });
            sel.innerHTML = html;
            sel.addEventListener('change', function() {
                var opt = sel.options[sel.selectedIndex];
                var sym = opt.value;
                var idxTicker = opt.getAttribute('data-index') || '';
                var idxSym = idxTicker ? ('NSE:' + idxTicker + '-INDEX') : null;
                setSymbol(sym, idxSym);
            });
        });
    }

    function populateIndexDropdown() {
        return fetch('/api/indices').then(function(r) { return r.json(); }).then(function(rows) {
            var indices = (rows || []).filter(function(i) { return i.ticker; });
            indices.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
            var sel = document.getElementById('cwSymbol');
            var html = '';
            indices.forEach(function(i) {
                var sym = 'NSE:' + i.ticker + '-INDEX';
                var label = i.name || i.ticker;
                html += '<option value="' + sym + '">' + label + '</option>';
            });
            sel.innerHTML = html;
            sel.addEventListener('change', function() {
                var opt = sel.options[sel.selectedIndex];
                setSymbol(null, opt.value);
            });
        });
    }

    function indexSymbolForTicker(ticker) {
        if (!ticker) return null;
        // Already a full symbol? pass through.
        if (ticker.indexOf(':') !== -1) return ticker;
        return 'NSE:' + ticker + '-INDEX';
    }

    // Apply index-mode layout class before populating, so the user doesn't see
    // a brief flash of the 2x2 grid.
    if (isIndexMode) {
        var gridEl = document.querySelector('.cw-grid');
        if (gridEl) gridEl.classList.add('cw-mode-index');
        // Header reads "INDEX" instead of "STOCK" in index mode.
        var titleEl = document.querySelector('.cw-title');
        if (titleEl) titleEl.textContent = 'INDEX CHARTS';
        var symLabel = document.querySelector('label[for="cwSymbol"]');
        if (symLabel) symLabel.textContent = 'INDEX';
    }

    // ── Init ─────────────────────────────────────────────────────────────
    // Fetch the scanner status first so the layout is correct before any panes
    // mount — saves a flash of panes that hide a moment later.
    //   Stock mode → respects enableStockHtfAlignment / enableIndexAlignment /
    //                enableIndexHtfAlignment. Stock 5m is always shown.
    //   Index mode → respects enableIndexHtfAlignment (the 1h pane).
    // Defaults if the fetch fails are "show everything" so we degrade to the
    // pre-filter layout instead of a blank window.
    function applyHtfPref() {
        return fetch('/api/scanner/status').then(function(r) { return r.json(); }).then(function(s) {
            if (isIndexMode) {
                indexHtfHidden = !(s && s.enableIndexHtfAlignment === true);
                if (indexHtfHidden) {
                    var gridEl = document.querySelector('.cw-grid');
                    if (gridEl) gridEl.classList.add('cw-htf-off');
                }
            } else {
                paneShown.stock5  = true;
                paneShown.stock60 = !!(s && s.enableStockHtfAlignment === true);
                paneShown.index5  = !!(s && s.enableIndexAlignment === true);
                paneShown.index60 = !!(s && s.enableIndexHtfAlignment === true);
                applyStockGridLayout();
            }
        }).catch(function() {
            indexHtfHidden = false;  // default: show both index panes
            // Stock mode defaults already in paneShown initialisation (all true).
            if (!isIndexMode) applyStockGridLayout();
        });
    }

    // Stock-mode layout: hide non-enabled panes, set the grid count class, and
    // for the 3-chart special case put the third visible pane in its own row
    // spanning both columns. Pane DOM order is stock5, stock60, index5, index60
    // so the "first 3 visible" naturally land in the expected positions.
    function applyStockGridLayout() {
        var grid = document.querySelector('.cw-grid');
        if (!grid) return;
        var order = ['stock5', 'stock60', 'index5', 'index60'];
        var visible = [];
        order.forEach(function(k) {
            var el = document.querySelector('.cw-pane[data-pane="' + k + '"]');
            if (!el) return;
            el.style.gridColumn = '';
            el.style.gridRow = '';
            if (paneShown[k]) {
                el.style.display = '';
                visible.push({ key: k, el: el });
            } else {
                el.style.display = 'none';
            }
        });
        grid.classList.remove('cw-count-1', 'cw-count-2', 'cw-count-3', 'cw-count-4');
        grid.classList.add('cw-count-' + visible.length);
        // 3-chart special: top row holds positions 1-2, the third spans the
        // entire bottom row.
        if (visible.length === 3) {
            visible[2].el.style.gridColumn = '1 / -1';
        }
    }

    var populate = isIndexMode ? populateIndexDropdown : populateStockDropdown;
    applyHtfPref().then(populate).then(function() {
        var sel = document.getElementById('cwSymbol');
        if (isIndexMode) {
            // Index mode: only initialIndex matters. Match dropdown selection to it.
            if (initialIndex) {
                for (var i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value === initialIndex) { sel.selectedIndex = i; break; }
                }
                setSymbol(null, sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].value : initialIndex);
            } else if (sel.options.length > 0) {
                setSymbol(null, sel.options[0].value);
            }
        } else if (initialSymbol) {
            // Match the dropdown to the requested symbol so the user sees the right
            // selection. Fall back to the first option if the symbol isn't in the
            // enabled universe (e.g., disabled stock or stale link).
            for (var j = 0; j < sel.options.length; j++) {
                if (sel.options[j].value === initialSymbol) { sel.selectedIndex = j; break; }
            }
            var opt = sel.options[sel.selectedIndex];
            var idxSym = initialIndex || indexSymbolForTicker(opt && opt.getAttribute('data-index'));
            setSymbol(initialSymbol, idxSym);
        } else if (sel.options.length > 0) {
            var opt0 = sel.options[0];
            var idx0 = indexSymbolForTicker(opt0.getAttribute('data-index'));
            setSymbol(opt0.value, idx0);
        }
    });

    // Cleanup timers when window closes.
    window.addEventListener('beforeunload', function() {
        Object.keys(panes).forEach(function(k) { clearPane(panes[k]); });
    });

})();
</script>

</body>
